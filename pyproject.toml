[project]
name = "fiaptc-churn-prediction"
version = "0.1.0"
description = "Predicao de churn de clientes de uma operadora de telecomunicacoes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "joblib==1.4.2",
    "kagglehub==0.3.6",
    "matplotlib==3.10.0",
    "numpy==2.0.2",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
